<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 820 470' width='820' height='470' role='img' aria-label='Due and ESP32 VID6606 X27 wiring'>
<title>Due and ESP32 VID6606 X27 wiring</title>
<rect width='820' height='470' fill='#ffffff'/>
<text x='30' y='38' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='18' fill='#1f2328' text-anchor='start' font-weight='bold'>Arduino Due and ESP32: direct mode is refused, use a VID6606</text>
<text x='30' y='60' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#59636e' text-anchor='start' font-weight='normal'>Due pins are rated 3 mA; ESP32 at 3.3 V gives a 260 ohm coil only about 13 mA. An X27 coil wants about 20 mA at 5 V.</text>
<rect x='30' y='90' width='220' height='220' rx='10' fill='#e7f0e9' stroke='#2f6f3e' stroke-width='1.5'/>
<text x='46' y='116' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' fill='#2f6f3e' text-anchor='start' font-weight='bold'>Due  /  ESP32</text>
<text x='46' y='134' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#59636e' text-anchor='start' font-weight='normal'>3.3 V logic</text>
<rect x='340' y='100' width='170' height='210' rx='6' fill='#eef1f5' stroke='#4b5563' stroke-width='1.5'/>
<text x='425' y='126' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' fill='#1f2328' text-anchor='middle' font-weight='bold'>VID6606</text>
<text x='425' y='144' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#59636e' text-anchor='middle' font-weight='normal'>channel A shown</text>
<text x='234' y='164' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#1f2328' text-anchor='end' font-weight='bold'>D22  /  GPIO25</text>
<text x='46' y='164' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#59636e' text-anchor='start' font-weight='normal'>pins[0]</text>
<polyline points='250,160 340,160' fill='none' stroke='#c2410c' stroke-width='2.5' stroke-linejoin='round' stroke-linecap='round'/>
<text x='348' y='164' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#1f2328' text-anchor='start' font-weight='normal'>f(scx)A  28</text>
<text x='295' y='154' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='10' fill='#59636e' text-anchor='middle' font-weight='normal'>STEP</text>
<text x='234' y='194' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#1f2328' text-anchor='end' font-weight='bold'>D23  /  GPIO26</text>
<text x='46' y='194' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#59636e' text-anchor='start' font-weight='normal'>pins[1]</text>
<polyline points='250,190 340,190' fill='none' stroke='#0f766e' stroke-width='2.5' stroke-linejoin='round' stroke-linecap='round'/>
<text x='348' y='194' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#1f2328' text-anchor='start' font-weight='normal'>CW/CCW A  27</text>
<text x='295' y='184' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='10' fill='#59636e' text-anchor='middle' font-weight='normal'>DIR</text>
<text x='234' y='224' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#1f2328' text-anchor='end' font-weight='bold'>D24  /  GPIO27</text>
<text x='46' y='224' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#59636e' text-anchor='start' font-weight='normal'>pins[2]</text>
<polyline points='250,220 340,220' fill='none' stroke='#1d4ed8' stroke-width='2.5' stroke-linejoin='round' stroke-linecap='round'/>
<text x='348' y='224' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#1f2328' text-anchor='start' font-weight='normal'>RESET  26</text>
<text x='295' y='214' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='10' fill='#59636e' text-anchor='middle' font-weight='normal'>RESET_N</text>
<text x='234' y='254' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#1f2328' text-anchor='end' font-weight='bold'>GND</text>
