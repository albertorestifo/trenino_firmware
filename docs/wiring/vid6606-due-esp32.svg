<text x='295' y='244' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='10' fill='#59636e' text-anchor='middle' font-weight='normal'>GND</text>
<text x='234' y='284' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#1f2328' text-anchor='end' font-weight='bold'>5V  /  VIN</text>
<polyline points='250,280 340,280' fill='none' stroke='#b91c1c' stroke-width='2.5' stroke-linejoin='round' stroke-linecap='round'/>
<text x='348' y='284' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#1f2328' text-anchor='start' font-weight='normal'>VDD  1, 15</text>
<text x='295' y='274' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='10' fill='#59636e' text-anchor='middle' font-weight='normal'>5 V</text>
<text x='502' y='154' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#1f2328' text-anchor='end' font-weight='normal'>OUT1A</text>
<polyline points='510,150 612,150' fill='none' stroke='#c2410c' stroke-width='2.5' stroke-linejoin='round' stroke-linecap='round'/>
<text x='502' y='186' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#1f2328' text-anchor='end' font-weight='normal'>OUT2A</text>
<polyline points='510,182 612,182' fill='none' stroke='#d97706' stroke-width='2.5' stroke-linejoin='round' stroke-linecap='round'/>
<text x='502' y='218' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#1f2328' text-anchor='end' font-weight='normal'>OUT3A</text>
<polyline points='510,214 612,214' fill='none' stroke='#0f766e' stroke-width='2.5' stroke-linejoin='round' stroke-linecap='round'/>
<text x='502' y='250' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#1f2328' text-anchor='end' font-weight='normal'>OUT4A</text>
<polyline points='510,246 612,246' fill='none' stroke='#1d4ed8' stroke-width='2.5' stroke-linejoin='round' stroke-linecap='round'/>
<rect x='620' y='110' width='170' height='190' rx='14' fill='#f6f2e8' stroke='#8a6d1f' stroke-width='1.5'/>
<circle cx='720' cy='192' r='38' fill='#fff' stroke='#8a6d1f' stroke-width='1.5'/>
<circle cx='720' cy='192' r='5' fill='#8a6d1f'/>
<text x='720' y='260' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#1f2328' text-anchor='middle' font-weight='bold'>X27.168</text>
<text x='720' y='280' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#59636e' text-anchor='middle' font-weight='normal'>rear view, pins down</text>
<rect x='612' y='145' width='16' height='10' rx='2' fill='#b0b7c0'/>
<text x='636' y='154' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#c2410c' text-anchor='start' font-weight='bold'>1</text>
<rect x='612' y='177' width='16' height='10' rx='2' fill='#b0b7c0'/>
<text x='636' y='186' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#d97706' text-anchor='start' font-weight='bold'>2</text>
<rect x='612' y='209' width='16' height='10' rx='2' fill='#b0b7c0'/>
<text x='636' y='218' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#0f766e' text-anchor='start' font-weight='bold'>3</text>
<rect x='612' y='241' width='16' height='10' rx='2' fill='#b0b7c0'/>
<text x='636' y='250' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#1d4ed8' text-anchor='start' font-weight='bold'>4</text>
<text x='654' y='170' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='10' fill='#59636e' text-anchor='start' font-weight='normal'>coil A</text>
<text x='654' y='234' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='10' fill='#59636e' text-anchor='start' font-weight='normal'>coil B</text>
<text x='30' y='350' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#59636e' text-anchor='start' font-weight='normal'>VDD must be 4.5-5.5 V. Add 100 nF at each VDD pin and about 5 uF per motor (see the train-lever BOM).</text>
<text x='30' y='370' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#59636e' text-anchor='start' font-weight='normal'>Hold RESET_N low at power-up with 10 k to GND; the firmware raises it when the gauge starts.</text>
<text x='30' y='390' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#59636e' text-anchor='start' font-weight='normal'>Inputs need VIH &gt;= 3.15 V. 3.3 V outputs meet that only just: for long wires add a 74HCT125 at 5 V.</text>
<text x='30' y='410' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#59636e' text-anchor='start' font-weight='normal'>Wire channels B-D the same way; four motors share one chip and one RESET_N pin.</text>
</svg>
